name: CHDers GitHub Metrics

on:
  schedule:
    # 09:15 Asia/Shanghai
    - cron: "15 1 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/Metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub metrics for CHDers
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Display data for this account only.
          user: CHDers

          # New file name prevents reuse of the legacy metrics SVG.
          filename: github-metrics-chders.svg
          committer_message: "chore: update CHDers GitHub metrics"

          template: classic
          config_timezone: Asia/Shanghai

          # Account activity belongs to CHDers.
          base: header, activity, community, repositories
          base_indepth: yes

          # Restrict repository collection to repositories owned by CHDers.
          repositories_affiliations: owner
          repositories_forks: no

          # Contribution calendar for CHDers.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

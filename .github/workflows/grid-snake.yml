name: CHDers Contribution Snake

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/grid-snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate CHDers contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: CHDers
          outputs: |
            dist/github-contribution-grid-snake-chders.svg
            dist/github-contribution-grid-snake-chders-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CHDers snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
